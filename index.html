<style>

  .ctl{display:none;position:absolute;touch-action:none;z-index:2}

  body.intitle .ctl{display:none!important}

  /* ---- cruceta de direcciones ---- */
  #pad{display:none;position:absolute;z-index:2;touch-action:none;grid-template-columns:repeat(3,80px);grid-template-rows:repeat(3,80px);gap:6px;user-select:none}

    box-shadow:inset 0 2px 0 #8d92ad,inset 0 -4px 0 #0e0f19,0 6px 8px #000a;text-shadow:0 2px 0 #000;transition:transform .05s}
  #pad button.on{transform:translateY(3px);color:#ffe94a;text-shadow:0 0 12px #ffd21a;
    background:linear-gradient(180deg,#6b6130 0%,#3c3513 60%,#241f08 100%);box-shadow:inset 0 2px 0 #b9a94a,inset 0 -2px 0 #0e0f19,0 2px 3px #000a}
  #pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .r{grid-column:3;grid-row:2}#pad .d{grid-column:2;grid-row:3}
  #pad .mid{grid-column:2;grid-row:2;border-radius:50%;background:radial-gradient(circle,#15161f 30%,#262a3a 100%);margin:18px;box-shadow:inset 0 3px 6px #000}

  /* ---- botón de pausa ---- */

    background:rgba(10,12,22,.72);box-shadow:0 3px 6px #0009;touch-action:none;cursor:pointer}

  #mutebtn{display:none;position:absolute;z-index:3;width:44px;height:44px;border-radius:50%;border:2px solid #f6c90e;padding:0;
    background:rgba(10,12,22,.72);box-shadow:0 3px 6px #0009;touch-action:none;cursor:pointer}

  #mutebtn .sl{display:none;stroke:#ff5a4a;stroke-width:2.4} body.muted #mutebtn .sl{display:block} body.muted #mutebtn .wv{display:none}

<script>
"use strict";
/* ===================== MICRO-X =====================
   Micros amarillas vs. radiopatrullas, baches y banderas.
   Un clon con sabor chileno del clásico Rally-X.
=====================================================*/
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
/* Mapa fiel al de Rally-X (32x56 casillas). # = manzana, . = calle */
const MAP = [
  "...............########.........",
  ".###.#####.##......####.#######.",
  ".###.#####.##...#..####.........",
  "................#.......###.###.",
  ".######.#####......####.###.###.",
  "...............###.####.........",
  "....######.#.#####.####.#######.",
  "#.#......#.#.###................",
  "#.#.####.#.#.###.###.#########.#",
  "#.#.#....#.#.###.###.#.......#.#",
  "#.#.#.##.#.#.....###.#.......#.#",
  "..#.#.##.#.#.###.###.#.#####.#.#",
  ".##.#....#.#.###.###.#.#####.#.#",
  ".##.#.####.#.........#.......#.#",
  "....#......#.###.##..###..####.#",
  ".##.#.######.###.##..###..####.#",
  ".##..........###.##..###..####..",
  ".###########.###................",
  "......##..................###.##",
  ".####.##.#######..######..###.##",
  ".####........###..######......##",
  ".####.##.###.###......##..###..#",
  "......##.###......##..##..###..#",
  "#.######.#######..##..##..####.#",
  "#.................##...........#",
  "#.######.#######..######..####.#",
  "#.######.#######..######..####.#",
  "#...............................",
  "#.###.##.####.##..###.##..####.#",
  "#.###.##.####.##..###.##..####.#",
  "#.###.##.##...........##..##...#",
  "#.###.##.##.#.##..###.##..##.#.#",
  "#.............##..###.....##.#.#",
  "#.##.###.####.##......##.....#..",
  "#.##.###.####.##..###.##..#####.",
  "#..........##.##..###.##..#####.",
  "#.####.###......................",
  "..####.###......................",
  ".........###.##.###.####..##.##.",
  "..##.###.###.##.###.####..##.##.",
  "..##.###.###........####..##.##.",
  "..##.###.###.##.###.......##....",
  "..##.........##.....#.##..##.##.",
  "..##.#####.####.###.#.##..##.##.",
  "..##.#####.####.###.#.##..##.##.",
  "....................#........##.",
  "##.###.##.#####.###.#.##..##.##.",
  "##.###.##.#####.###.#.##..##.##.",
  "##....................##..##.##.",
  "##.###.##.#.#.#.#.#.#.##..##.##.",
  "##.###.##.#.#.#.#.#.#.##........",
  "....##....#.#.#.#.#.#.....#####.",
  ".##....##.#.#.#.#.#.#.##..#####.",
  ".##.#####.#.#.#.#.#.#.##.....##.",
  ".##.#####.#.#.#.#.#.#.##..##.##.",
  "..........................##...."
];
const W = MAP[0].length, H = MAP.length;
const ZOOMS = [36,48,60], ZNAMES = ['LEJOS','MEDIO','CERCA'], MAXL = 20;
let zoomI = 1; try { const z=+localStorage.getItem('microx_zoom'); if(z>=0&&z<3&&localStorage.getItem('microx_zoom')!==null) zoomI=z; } catch(e){}
let T = ZOOMS[zoomI], K = T/40;
function setZoom(i){ zoomI=(i+3)%3; T=ZOOMS[zoomI]; K=T/40; camSnap=true; try{localStorage.setItem('microx_zoom',zoomI);}catch(e){} }
const diff = ()=>(level-1)/(MAXL-1);            // 0 (nivel 1) .. 1 (nivel 20)
let startLevel = 1, menuSel = 0, editBuf = null, camSnap = true, fdt = 0.016;
function setHi(v){ hi=Math.max(0,Math.min(99999999,v|0)); try{localStorage.setItem('microx_hi',hi);}catch(e){} }
let VW = 640, VH = 480, LW = 880, LH = 480, CVH = 480, tall = false, RS = 5;
let paused = false, pauseSel = 0, pauseBtns = [];
let emptyT = 0, lowT = 0, runStats = [], lvStartScore = 0;
let ctlMode = 0; try{ ctlMode = localStorage.getItem('microx_ctl')==='1'?1:0; }catch(e){}
function setCtl(v){ ctlMode=v; document.body.classList.toggle('padmode',v===1); try{localStorage.setItem('microx_ctl',v);}catch(e){} }
let smokeReq = false;
const DX = [1,0,-1,0], DY = [0,1,0,-1];     // 0 der, 1 abajo, 2 izq, 3 arriba
const PLAYER_SPEED = 4.2;                   // casillas/seg
const TOTAL_FLAGS = 10;

let grid, baches, flags = [], tanks = [], enemies = [], clouds = [], puffs = [], floaters = [];
let player, level = 1, score = 0, lives = 3, combo = 1, fuel = 100;
let hi = 0; try { hi = +localStorage.getItem('microx_hi')||0; } catch(e){}
let state = 'title', stateT = 0, clock = 0, msg = '', msgT = 0;
let field = null, fieldKey = -1, smokeCD = 0, invuln = 0, puffT = 0, roadCount = 0;
let startTile = {x:0,y:0}, enemySpawns = [];

/* ---------- utilidades ---------- */
const idx = (x,y)=>y*W+x;
const isWall = (x,y)=>x<0||y<0||x>=W||y>=H||grid[idx(x,y)]===1;
const rnd = n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return (h^(h>>>16))>>>0;}

/* ---------- audio ---------- */
let actx = null;
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function beep(f,d,type='square',v=0.05,slide=0){
  const a = audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,a.currentTime);
  if(slide) o.frequency.linearRampToValueAtTime(f+slide,a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d);
}
/* ---------- música: chiptune original con ritmo de cumbia (se genera en el dispositivo; no usa archivos) ---------- */
let musicOn = true; try{ musicOn = localStorage.getItem('microx_music')!=='0'; }catch(e){}
let mGain=null, nBuf=null, mStep=0, mNext=0, mTimer=null;
const MF=n=>440*Math.pow(2,(n-69)/12);
const BASS_R=[45,50,52,45], BASS_F=[52,57,59,52];                 // La menor · Re menor · Mi · La menor
const MEL=[69,0,0,72, 0,71,69,0, 67,0,69,0, 0,0,64,0,
           65,0,0,69, 0,67,65,0, 62,0,65,0, 0,0,0,0,
           64,0,0,68, 0,71,68,0, 64,0,68,0, 0,0,0,0,
           69,0,72,0, 71,0,69,0, 67,0,64,0, 69,0,0,0];
function mTone(type,f,t,dur,vol){
  const a=actx, o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(mGain); o.start(t); o.stop(t+dur+0.03);
}
function mNoise(t,dur,vol,type,freq){
  const a=actx, src=a.createBufferSource(); src.buffer=nBuf;
  const f=a.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=a.createGain();
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(mGain); src.start(t); src.stop(t+dur+0.03);
}
function mKick(t){
  const a=actx, o=a.createOscillator(), g=a.createGain(); o.type='sine';
  o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+0.13);
  g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.connect(g); g.connect(mGain); o.start(t); o.stop(t+0.18);
}
function mStepPlay(i,t,sd){
  const bar=(i>>4)&3, s=i&15;
  const note=MEL[i]; if(note) mTone('square',MF(note),t,sd*1.9,0.045);
  if(s===0||s===8||s===3||s===11) mTone('triangle',MF(BASS_R[bar]),t,sd*2.2,0.16);       // bajo (tumbao)
  if(s===6||s===14) mTone('triangle',MF(BASS_F[bar]),t,sd*2.2,0.16);
  if(s===0||s===8) mKick(t);
  if(s===4||s===12) mNoise(t,0.09,0.12,'bandpass',1800);                                  // caja
  if(s%2===0) mNoise(t,0.035,s%4===0?0.075:0.04,'highpass',5500);                         // güiro
}
const tempoMul=()=>state!=='play'?1:(fuel<=0?1.35:fuel<12?1.28:fuel<30?1.14:1);
function musicTick(){
  const a=actx; if(!a||!mGain) return;
  mGain.gain.setTargetAtTime(state==='dying'?0.08:(state==='summary'||state==='title'||state==='over'||state==='win')?0.7:1,a.currentTime,0.12);
  if(mNext<a.currentTime) mNext=a.currentTime+0.02;
  const sd=60/(104*tempoMul())/4;
  while(mNext<a.currentTime+0.18){ mStepPlay(mStep,mNext,sd); mNext+=sd; mStep=(mStep+1)&63; }
}
function startMusic(){
  const a=audio(); if(!a||mTimer||!musicOn) return;
  try{ if(a.state==='suspended') a.resume(); }catch(e){}
  if(!mGain){ mGain=a.createGain(); mGain.gain.value=0.55; mGain.connect(a.destination);
    nBuf=a.createBuffer(1,a.sampleRate*0.3,a.sampleRate); const d=nBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  mNext=a.currentTime+0.05;
  mTimer=setInterval(()=>{ if(paused||document.hidden){ mNext=0; return; } musicTick(); },40);
}
function stopMusic(){ if(mTimer){ clearInterval(mTimer); mTimer=null; } }
function setMusic(v){
  musicOn=v; try{localStorage.setItem('microx_music',v?'1':'0');}catch(e){}
  document.body.classList.toggle('muted',!v);
  if(v) startMusic(); else stopMusic();
}
function unlockAudio(){ audio(); startMusic(); }
const sfx = {
  flag:  ()=>{beep(660,.08);setTimeout(()=>beep(990,.12),70);},
  fuel:  ()=>{beep(300,.25,'triangle',.07,400);},
  smoke: ()=>{beep(120,.35,'sawtooth',.06,-60);},
  crash: ()=>{beep(200,.6,'sawtooth',.09,-170);},
  clear: ()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*110));},
  stun:  ()=>{beep(880,.1,'square',.04,-500);},
  low:   ()=>{beep(520,.10,'square',.05);setTimeout(()=>beep(380,.14,'square',.05),110);},
};

/* ---------- generación del mapa ---------- */
function genMap(){
  grid = new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++) grid[idx(x,y)] = MAP[y][x]==='#'?1:0;
  roadCount=0; for(let k=0;k<grid.length;k++) if(grid[k]===0) roadCount++;
}
function bfs(sx,sy,blockBaches=true){
  const d = new Int16Array(W*H).fill(9999), q=[idx(sx,sy)]; d[q[0]]=0;
  for(let h=0;h<q.length;h++){
    const c=q[h], x=c%W, y=(c/W)|0;
    for(let k=0;k<4;k++){
      const nx=x+DX[k], ny=y+DY[k]; if(isWall(nx,ny))continue;
      const ni=idx(nx,ny); if(d[ni]!==9999)continue;
      if(blockBaches&&baches[ni])continue;
      d[ni]=d[c]+1; q.push(ni);
    }
  }
  return d;
}
function roadTiles(){ const r=[]; for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(!isWall(x,y)) r.push([x,y]); return r; }

/* ---------- niveles ---------- */
function setupLevel(n){
  level=n; genMap();
  runStats[n-1]={pts:0,t:0,fuel:0,deaths:0,smokes:0,stuns:0}; lvStartScore=score; lowT=0;
  baches = new Uint8Array(W*H);
  startTile = {x:16, y:27};
  const road = shuffle(roadTiles());
  const far = (x,y,m)=>Math.abs(x-startTile.x)+Math.abs(y-startTile.y)>m;
  // banderas y bidones
  flags=[]; tanks=[];
  const taken=new Set();
  const pick=(minStart,minSep,list)=>{
    for(const [x,y] of road){
      if(taken.has(idx(x,y))||!far(x,y,minStart))continue;
      if(list.some(f=>Math.abs(f.x-x)+Math.abs(f.y-y)<minSep))continue;
      taken.add(idx(x,y)); list.push({x,y}); return;
    }
  };
  for(let i=0;i<TOTAL_FLAGS;i++) pick(8,5,flags);
  for(let i=0;i<3;i++) pick(10,12,tanks);
  // baches (sin aislar ninguna parte del mapa)
  const nB = Math.round(8+30*((n-1)/(MAXL-1)));
  let placed=0, nonBache=roadCount;
  for(const [x,y] of road){
    if(placed>=nB)break;
    if(taken.has(idx(x,y))||!far(x,y,4))continue;

const openP = (x,y)=>!isWall(x,y);
function movePlayer(dist){
  const w=wantDir();
  while(dist>1e-6){
    if(player.t===0){
      if(w>=0&&openP(player.cx+DX[w],player.cy+DY[w])) player.dir=w;
      else if(player.dir>=0&&!openP(player.cx+DX[player.dir],player.cy+DY[player.dir])) player.dir=-1;

      player.cx+=DX[player.dir]; player.cy+=DY[player.dir]; player.t=1-player.t; player.dir=w; player.face=w;
    }
    const need=1-player.t;
    if(dist>=need){
      player.cx+=DX[player.dir]; player.cy+=DY[player.dir]; player.t=0; dist-=need;

    } else { player.t+=dist; dist=0; }
  }
}

function arrive(){
  const i=idx(player.cx,player.cy);
  if(baches[i]){ die('¡Caíste en un bache!'); return true; }
  for(let k=flags.length-1;k>=0;k--) if(flags[k].x===player.cx&&flags[k].y===player.cy){
    flags.splice(k,1); const pts=100*combo; score+=pts;

  for(let k=tanks.length-1;k>=0;k--) if(tanks[k].x===player.cx&&tanks[k].y===player.cy){
    tanks.splice(k,1); fuel=Math.min(100,fuel+30); score+=50; sfx.fuel();

function chooseDir(e){

    if(!isWall(nx,ny)&&!baches[idx(nx,ny)]) c.push(k); }
  if(!c.length) return -1;
  const rev=e.dir>=0?(e.dir+2)%4:-1;

  let best=pool[0], bv=1e9;

}
function moveEnemy(e,dist){
  while(dist>1e-6){
    if(e.t===0){ e.dir=chooseDir(e); if(e.dir<0)return; e.face=e.dir; }
    const need=1-e.t;

function updatePlay(dt){

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); fdt=dt; last=now; clock+=dt;
  if(paused){ draw(); requestAnimationFrame(frame); return; }
  stateT+=dt;

  else if(state==='clear'){ if(stateT>2.8){ if(level>=MAXL) finishRun(true); else if(level%3===0) go('summary'); else nextLevel(); } }
  for(const p of puffs){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.s+=dt*14;}
  puffs=puffs.filter(p=>p.t>0);
  for(const f of floaters){f.t-=dt;f.y-=dt*30;}
  floaters=floaters.filter(f=>f.t>0);

/* ---------- dibujo ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill();}
const ROAD='#df9847', BLOCK='#55c200', EDGE='#c25500';
function drawWorld(cx0,cy0){
  const x0=Math.max(0,(cx0/T)|0), y0=Math.max(0,(cy0/T)|0);
  const x1=Math.min(W-1,x0+(VW/T|0)+2), y1=Math.min(H-1,y0+(VH/T|0)+2);
  const B=3;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const px=Math.round(x*T-cx0), py=Math.round(y*T-cy0), w=isWall(x,y);
    ctx.fillStyle=w?BLOCK:ROAD; ctx.fillRect(px,py,T,T);
    if(!w){ if(baches[idx(x,y)]) drawBache(px+T/2,py+T/2,hash(x,y)); continue; }
    ctx.fillStyle=EDGE;
    const iu=y>0&&!isWall(x,y-1), id=y<H-1&&!isWall(x,y+1), il=x>0&&!isWall(x-1,y), ir=x<W-1&&!isWall(x+1,y);
    if(iu)ctx.fillRect(px,py,T,B); if(id)ctx.fillRect(px,py+T-B,T,B);
    if(il)ctx.fillRect(px,py,B,T); if(ir)ctx.fillRect(px+T-B,py,B,T);
    // esquinas cóncavas (el borde debe cerrarse)
    const dg=(dx,dy)=>{const u=x+dx,v=y+dy;return u>=0&&v>=0&&u<W&&v<H&&!isWall(u,v);};
    if(!iu&&!il&&dg(-1,-1))ctx.fillRect(px,py,B,B);
    if(!iu&&!ir&&dg(1,-1))ctx.fillRect(px+T-B,py,B,B);
    if(!id&&!il&&dg(-1,1))ctx.fillRect(px,py+T-B,B,B);

}
function star(x,y,r,on){
  ctx.fillStyle=on?'#ffd21a':'#3a3f55'; ctx.beginPath();
  for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.45:r; ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); }
  ctx.closePath(); ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.stroke();
}
const fmtT=t=>{ t=Math.round(t); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
function drawSummary(){
  const W_=LW, H_=CVH, cx=W_/2;
  const g=ctx.createLinearGradient(0,0,0,H_); g.addColorStop(0,'#16224f'); g.addColorStop(1,'#0b0c14');
  ctx.fillStyle=g; ctx.fillRect(0,0,W_,H_);
  const lv0=Math.max(1,level-2), rows=[];
  for(let n=lv0;n<=level;n++) if(runStats[n-1]) rows.push([n,runStats[n-1]]);
  const tot=rows.reduce((a,[,r])=>({pts:a.pts+r.pts,t:a.t+r.t,deaths:a.deaths+r.deaths,smokes:a.smokes+r.smokes,stuns:a.stuns+r.stuns}),{pts:0,t:0,deaths:0,smokes:0,stuns:0});
  const top=Math.round(Math.max(36,(H_-430)*0.35));
  ctx.textAlign='center';
  ctx.fillStyle='#000'; ctx.font='bold '+(tall?26:32)+'px "Courier New"'; ctx.fillText('¡TRAMO COMPLETADO!',cx+2,top+32);
  ctx.fillStyle='#f6c90e'; ctx.fillText('¡TRAMO COMPLETADO!',cx,top+30);
  ctx.fillStyle='#cfd6ff'; ctx.font='bold 14px "Courier New"'; ctx.fillText('Niveles '+lv0+' a '+level+' de '+MAXL,cx,top+54);
  const ns=tot.deaths===0?3:tot.deaths===1?2:1;
  for(let i=0;i<3;i++) star(cx+(i-1)*44,top+92,17,i<ns);
  const tw=Math.min(W_-30,460), L=cx-tw/2, yh=top+142;
  ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(L,yh-18,tw,26*(rows.length+2)+14);
  ctx.font='bold 11px "Courier New"'; ctx.fillStyle='#f6c90e';
  ctx.textAlign='left'; ctx.fillText('NIVEL',L+10,yh); ctx.textAlign='right';
  ctx.fillText('PUNTOS',L+tw*0.52,yh); ctx.fillText('TIEMPO',L+tw*0.76,yh); ctx.fillText('BENC.',L+tw-10,yh);
  ctx.font='bold 15px "Courier New"';
  rows.forEach(([n,r],i)=>{ const y=yh+26*(i+1); ctx.fillStyle='#fff';
    ctx.textAlign='left'; ctx.fillText(String(n),L+10,y); ctx.textAlign='right';
    ctx.fillText('+'+r.pts,L+tw*0.52,y); ctx.fillText(fmtT(r.t),L+tw*0.76,y); ctx.fillText(r.fuel+'%',L+tw-10,y); });
  const yt=yh+26*(rows.length+1);
  ctx.fillStyle='#f6c90e'; ctx.fillRect(L+8,yt-18,tw-16,1);
  ctx.textAlign='left'; ctx.fillStyle='#ffe98a'; ctx.fillText('TOTAL',L+10,yt+2); ctx.textAlign='right';
  ctx.fillText('+'+tot.pts,L+tw*0.52,yt+2); ctx.fillText(fmtT(tot.t),L+tw*0.76,yt+2);
  ctx.textAlign='center'; ctx.font='13px "Courier New"'; ctx.fillStyle='#ccd';
  const yc=yt+44;
  ctx.fillText('Humo: '+tot.smokes+'  ·  Patrullas frenadas: '+tot.stuns,cx,yc);
  ctx.fillText('Choques: '+tot.deaths,cx,yc+20);
  if(tot.deaths===0){ ctx.fillStyle='#ffe98a'; ctx.fillText('¡Recorrido impecable!',cx,yc+40); ctx.fillStyle='#ccd'; }
  ctx.fillStyle='#fff'; ctx.font='bold 16px "Courier New"'; ctx.fillText('PUNTAJE  '+String(score).padStart(7,'0'),cx,yc+72);
  // calle con la micro de paseo
  const ry=H_-110; ctx.fillStyle='#3b3e45'; ctx.fillRect(0,ry,W_,110);
  ctx.fillStyle='#d9b92a'; for(let x=-80-((clock*100)%80);x<W_;x+=80) ctx.fillRect(x,ry+62,44,5);
  drawMicro(((clock*90)%(W_+160))-80,ry+34,0,1.7);
  if(stateT>0.8&&Math.floor(clock*2)%2){ ctx.fillStyle='#fff'; ctx.font='bold 15px "Courier New"'; ctx.fillText(touchUI?'TOCA PARA SEGUIR':'ENTER PARA SEGUIR',cx,ry-14); }
}
function draw(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,LW,CVH);
  if(state==='title'){ drawTitle(); return; }
  if(state==='summary'){ drawSummary(); return; }
  const pp=pos(player);
  { const look=(player.dir>=0&&state==='play')?T*1.3:0;
    const tx=Math.max(0,Math.min(W*T-VW,pp.x-VW/2+DX[player.face]*look)), ty=Math.max(0,Math.min(H*T-VH,pp.y-VH/2+DY[player.face]*look));
    if(camSnap||state==='ready'||state==='dying'){camX=tx;camY=ty;camSnap=false;}
    else{const k=Math.min(1,fdt*6);camX+=(tx-camX)*k;camY+=(ty-camY)*k;} }
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,VW,VH); ctx.clip();
  drawWorld(camX,camY);
  for(const f of tanks) drawTank(f.x*T+T/2-camX,f.y*T+T/2-camY);
  for(const f of flags) drawFlag(f.x*T+T/2-camX,f.y*T+T/2-camY);
  for(const e of enemies){ if(e.delay>0&&Math.floor(clock*10)%2) continue; const p=pos(e); drawCop(p.x-camX,p.y-camY,e.face,e.stun>0);
    if(e.stun>0){ ctx.fillStyle='#ff0'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText('✦',p.x-camX+Math.cos(clock*8)*12,p.y-camY-14+Math.sin(clock*8)*4); } }
  if(state==='dying'){
    const k=stateT/1.8; ctx.fillStyle=`rgba(255,${160-k*100|0},0,${1-k*.6})`;
    ctx.beginPath(); ctx.arc(pp.x-camX,pp.y-camY,10+k*44,0,7); ctx.fill();
    ctx.fillStyle=`rgba(255,240,150,${1-k})`; ctx.beginPath(); ctx.arc(pp.x-camX,pp.y-camY,6+k*22,0,7); ctx.fill();
  } else if(!(invuln>0&&Math.floor(clock*12)%2)) drawMicro(pp.x-camX,pp.y-camY,player.face);
  drawSmoke();
  if(state==='play'&&fuel<30&&fuel>0){            // aviso sobre la micro
    const crit=fuel<12, bl=Math.floor(clock*(crit?7:3.5))%2, sx=pp.x-camX, sy=pp.y-camY;
    const txt=crit?'¡CASI SIN BENCINA!':'¡POCA BENCINA!';
    ctx.font='bold 11px "Courier New"'; ctx.textAlign='left';
    const tw=Math.ceil(ctx.measureText(txt).width)+30, bx=Math.max(4,Math.min(VW-tw-4,sx-tw/2)), by=Math.max(tall?52:4,sy-T*0.5-30);
    ctx.fillStyle=bl?'#c4120a':'#5a0b08'; ctx.fillRect(bx,by,tw,20);
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.strokeRect(bx+.5,by+.5,tw-1,19);
    ctx.fillStyle='#fff'; ctx.fillRect(bx+6,by+4,8,12); ctx.fillStyle='#c4120a'; ctx.fillRect(bx+8,by+6,4,3);   // surtidor
    ctx.fillStyle='#fff'; ctx.fillRect(bx+14,by+6,3,2); ctx.fillRect(bx+16,by+6,1,7);
    ctx.fillText(txt,bx+22,by+14);
    ctx.fillStyle=bl?'#c4120a':'#5a0b08'; ctx.beginPath(); ctx.moveTo(sx-5,by+20); ctx.lineTo(sx+5,by+20); ctx.lineTo(sx,by+27); ctx.fill();
    if(crit){ ctx.strokeStyle=`rgba(255,40,30,${bl?.55:.15})`; ctx.lineWidth=8; ctx.strokeRect(4,4,VW-8,VH-8); }
  }
  ctx.font='bold 14px "Courier New"'; ctx.textAlign='center';
  for(const f of floaters){ ctx.fillStyle=`rgba(255,255,255,${Math.min(1,f.t*2)})`; ctx.fillText(f.txt,f.x-camX,f.y-camY-12); }
  if(fuel<=0&&state==='play'){ ctx.fillStyle='#ff5050'; ctx.font='bold 16px "Courier New"'; ctx.fillText('¡SIN BENCINA!  '+Math.max(0,Math.ceil(8-emptyT)),VW/2,tall?70:40); }
  ctx.restore();
  if(state==='ready') banner(msgT>0?msg:'NIVEL '+level+' de '+MAXL, level===1&&lives===3?(touchUI?'Desliza para girar · Toca = humo':'¡Junta las banderas!'):'');
  if(state==='dying'||state==='clear') banner(msg);
  if(state==='win') banner('¡COMPLETASTE LOS 20 RECORRIDOS!','Puntaje '+score+(score>=hi&&score>0?'  ¡NUEVO RÉCORD!':'')+'  ·  '+(touchUI?'Toca para volver':'Enter para volver'));
  if(state==='over') banner('FIN DEL RECORRIDO','Puntaje '+score+(score>=hi&&score>0?'  ¡NUEVO RÉCORD!':'')+'  ·  '+(touchUI?'Toca para volver':'Enter para volver'));
  if(paused) drawPause();
  drawHUD();
}
