const VERSION='2026.11.06-e';
try{ document.fonts.load('20px Anton'); }catch(e){}
const INK='#111', ORA='#f2a516', RED='#d6261c';
const pad7=n=>String(n).padStart(7,'0');
/* ---------- utilidades ---------- */
const idx = (x,y)=>y*W+x;
const isWall = (x,y)=>x<0||y<0||x>=W||y>=H||grid[idx(x,y)]===1;
const rnd = n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return (h^(h>>>16))>>>0;}

/* ---------- audio ---------- */
let actx = null;
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function beep(f,d,type='square',v=0.05,slide=0){
  const a = audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,a.currentTime);
  if(slide) o.frequency.linearRampToValueAtTime(f+slide,a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d);
}
/* ---------- música: obras de dominio público + una cumbia propia, sintetizadas en el dispositivo (sin archivos) ----------
   Cada pieza se escribe como texto «nota:duración» (paso = semicorchea) y se toca en un estilo (chip, marcha, galope, cumbia, solemne, pedal). */
const NB={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midiOf(n){ const m=/^([A-G])(#|b)?(-?\d)$/.exec(n); if(!m) throw new Error('nota '+n); return 12*(+m[3]+1)+NB[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); }
function seqOf(str){ const ev=[]; let st=0; for(const tok of str.trim().split(/\s+/)){ const [n,l]=tok.split(':'); const len=+l||1; if(n!=='R') ev.push([st,midiOf(n),len]); st+=len; } return {ev,len:st}; }
const CH={C:[48,52,55],G:[43,47,50],Am:[45,48,52],E:[40,44,47],D:[50,54,57],A:[45,49,52],Bm:[47,50,54],'F#m':[42,45,49],Dm:[50,53,57],Cm:[48,51,55]};
function harmOf(str){ const list=[]; let st=0; for(const tok of str.trim().split(/\s+/)){ const [c,l]=tok.split(':'); list.push({ch:c,start:st,len:+l}); st+=+l; } return {list,len:st}; }
function mkTrack(o){
  const L=seqOf(o.lead), H=harmOf(o.harm), len=Math.ceil(Math.max(L.len,H.len)/16)*16;
  const leadAt=new Array(len).fill(null); L.ev.forEach(([st,n,l])=>{ if(st<len) leadAt[st]=[n,l]; });
  const hAt=new Array(len).fill(null); for(const h of H.list) for(let st=h.start;st<h.start+h.len&&st<len;st++) hAt[st]={h,off:st-h.start};
  let last=null; for(let st=0;st<len;st++){ if(hAt[st]) last=hAt[st]; else if(last) hAt[st]={h:last.h,off:st-last.h.start}; }
  return Object.assign({len,leadAt,hAt,loops:0},o);
}
// «Himno a la Alegría» (Beethoven, dominio público): dos frases de 4 compases, en Do mayor
const ALEGRIA='E5:4 E5:4 F5:4 G5:4 G5:4 F5:4 E5:4 D5:4 C5:4 C5:4 D5:4 E5:4 E5:6 D5:2 D5:8 E5:4 E5:4 F5:4 G5:4 G5:4 F5:4 E5:4 D5:4 C5:4 C5:4 D5:4 E5:4 D5:6 C5:2 C5:8';
const ALEGRIA_H='C:16 G:16 C:16 G:16 C:16 G:16 C:16 G:8 C:8';
const TRACKS=[
  {name:'NO'},
  {name:'CUMBIA',custom:'cumbia',bpm:104,len:64,loops:0},
  mkTrack({name:'PARA ELISA',bpm:138,style:'chip',                                                      // Beethoven
    lead:'E5:1 D#5:1 E5:1 D#5:1 E5:1 B4:1 D5:1 C5:1 A4:3 R:1 C4:1 E4:1 A4:1 B4:3 R:1 E4:1 G#4:1 B4:1 C5:3 R:1 E4:1 E5:1 D#5:1 E5:1 D#5:1 E5:1 B4:1 D5:1 C5:1 A4:3 R:1 C4:1 E4:1 A4:1 B4:3 R:1 E4:1 C5:1 B4:1 A4:3 R:5',
    harm:'Am:19 E:8 Am:12 Am:7 E:3 Am:15'}),
  mkTrack({name:'ALEGRÍA',bpm:120,style:'chip',lead:ALEGRIA,harm:ALEGRIA_H}),
  mkTrack({name:'ALEGRÍA · MARCHA',bpm:112,style:'march',lead:ALEGRIA,harm:ALEGRIA_H}),
  mkTrack({name:'ALEGRÍA · GALOPE',bpm:160,style:'gallop',lead:ALEGRIA,harm:ALEGRIA_H}),
  mkTrack({name:'ALEGRÍA · CUMBIA',bpm:98,style:'cumbia',lead:ALEGRIA,harm:ALEGRIA_H}),
  mkTrack({name:'ALEGRÍA · SOLEMNE',bpm:62,style:'solemn',duty:.5,vol:.05,legato:1,lead:ALEGRIA,harm:ALEGRIA_H}),
  mkTrack({name:'REY DE LA MONTAÑA',bpm:112,style:'pedal',accel:true,duty:.25,                          // Grieg, Peer Gynt
    lead:'B4:2 C#5:2 D5:2 E5:2 F#5:2 D5:2 F#5:4 F5:2 C#5:2 F5:4 E5:2 C5:2 E5:4 B4:2 C#5:2 D5:2 E5:2 F#5:2 D5:2 F#5:2 B5:2 A5:2 F#5:2 D5:2 F#5:2 A5:4 R:4',
    harm:'Bm:64'}),
  mkTrack({name:'CANON (PACHELBEL)',bpm:76,style:'chip',                                                  // Pachelbel: línea superior y una variación propia
    lead:'F#5:8 E5:8 D5:8 C#5:8 B4:8 A4:8 B4:8 C#5:8 F#5:2 A5:2 F#5:2 D5:2 E5:2 A5:2 E5:2 C#5:2 D5:2 F#5:2 D5:2 B4:2 C#5:2 F#5:2 C#5:2 A4:2 B4:2 D5:2 B4:2 G4:2 A4:2 D5:2 F#5:2 D5:2 B4:2 D5:2 B4:2 G4:2 C#5:2 E5:2 C#5:2 A4:2',
    harm:'D:8 A:8 Bm:8 F#m:8 G:8 D:8 G:8 A:8 D:8 A:8 Bm:8 F#m:8 G:8 D:8 G:8 A:8'}),
  mkTrack({name:'TOCATA (BACH)',bpm:96,style:'solemn',duty:.5,vol:.055,legato:1,
    lead:'A5:2 G5:2 A5:12 R:4 G5:2 F5:2 E5:2 D5:2 C#5:2 D5:12 R:2 A4:2 G4:2 A4:12 R:4 G4:2 F4:2 E4:2 D4:2 C#4:2 D4:12 R:4',
    harm:'Dm:96'}),
  mkTrack({name:'QUINTA (BEETHOVEN)',bpm:108,style:'chip',lead:'R:2 G5:2 G5:2 G5:2 Eb5:12 R:2 F5:2 F5:2 F5:2 D5:12',harm:'Cm:20 G:28'}),
];
let musicMuted=false, musicTitle=3, musicGame=1;
try{ musicMuted=localStorage.getItem('microx_mute')==='1';
  const t=localStorage.getItem('microx_mtitle'), g=localStorage.getItem('microx_mgame');
  if(t!==null) musicTitle=Math.max(0,Math.min(TRACKS.length-1,+t||0)); if(g!==null) musicGame=Math.max(0,Math.min(TRACKS.length-1,+g||0)); }catch(e){}
let mGain=null, nBuf=null, mStep=0, mNext=0, mTimer=null, curTrack=-1;
const MF=n=>440*Math.pow(2,(n-69)/12);
const pulseCache={};
function pulse(d){
  if(pulseCache[d]) return pulseCache[d];
  const N=32, re=new Float32Array(N+1), im=new Float32Array(N+1);
  for(let n=1;n<=N;n++){ re[n]=2/(n*Math.PI)*Math.sin(n*Math.PI*d); im[n]=2/(n*Math.PI)*(1-Math.cos(n*Math.PI*d)); }
  return pulseCache[d]=actx.createPeriodicWave(re,im);
}
function mTone(type,f,t,dur,vol){
  const a=actx, o=a.createOscillator(), g=a.createGain();
  if(typeof type==='string') o.type=type; else o.setPeriodicWave(type);
  o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(dur,0.03));
  o.connect(g); g.connect(mGain); o.start(t); o.stop(t+Math.max(dur,0.03)+0.03);
}
function mNoise(t,dur,vol,type,freq){
  const a=actx, src=a.createBufferSource(); src.buffer=nBuf;
  const f=a.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=a.createGain();
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(mGain); src.start(t); src.stop(t+dur+0.03);
}
function mKick(t,v=0.5){
  const a=actx, o=a.createOscillator(), g=a.createGain(); o.type='sine';
  o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+0.13);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.connect(g); g.connect(mGain); o.start(t); o.stop(t+0.18);
}
// cumbia original (composición propia)
const BASS_R=[45,50,52,45], BASS_F=[52,57,59,52];
const MEL=[69,0,0,72, 0,71,69,0, 67,0,69,0, 0,0,64,0,
           65,0,0,69, 0,67,65,0, 62,0,65,0, 0,0,0,0,
           64,0,0,68, 0,71,68,0, 64,0,68,0, 0,0,0,0,
           69,0,72,0, 71,0,69,0, 67,0,64,0, 69,0,0,0];
function cumbiaStep(i,t,sd){
  const bar=(i>>4)&3, s=i&15;
  const note=MEL[i]; if(note) mTone('square',MF(note),t,sd*1.9,0.045);
  if(s===0||s===8||s===3||s===11) mTone('triangle',MF(BASS_R[bar]),t,sd*2.2,0.16);
  if(s===6||s===14) mTone('triangle',MF(BASS_F[bar]),t,sd*2.2,0.16);
  if(s===0||s===8) mKick(t);
  if(s===4||s===12) mNoise(t,0.09,0.12,'bandpass',1800);
  if(s%2===0) mNoise(t,0.035,s%4===0?0.075:0.04,'highpass',5500);
}
function trackStep(T_,i,t,sd){
  const ev=T_.leadAt[i];
  if(ev) mTone(pulse(T_.duty||0.25),MF(ev[0]),t,ev[1]*sd*(T_.legato||0.94),T_.vol||0.06);          // melodía
  const hh=T_.hAt[i]; if(!hh) return;
  const ch=CH[hh.h.ch], s=i%16, rem=hh.h.len-hh.off;
  switch(T_.style){
    case 'march':                                                                                      // marcha: bajo en 1 y 3, acordes y caja en 2 y 4
      if(s===0||s===8){ mTone('triangle',MF(ch[0]),t,sd*3,.15); mKick(t); }
      if(s===4||s===12){ mTone(pulse(.5),MF(ch[1]+12),t,sd*1.5,.03); mTone(pulse(.5),MF(ch[2]+12),t,sd*1.5,.03); mNoise(t,.08,.1,'bandpass',1800); }
      if(s%4===2) mNoise(t,.03,.04,'highpass',6000); break;
    case 'gallop':                                                                                     // galope: bajo en corcheas
      if(s%2===0) mTone('triangle',MF(ch[0]),t,sd*1.6,.14);

      if(s===6||s===14) mTone('triangle',MF(ch[2]),t,sd*2.2,.16);
      if(s===0||s===8) mKick(t); if(s===4||s===12) mNoise(t,.09,.12,'bandpass',1800);

    default:                                                                                           // chip: bajo en cada tiempo y arpegio suave

}

/* ---------- generación del mapa ---------- */
function genMap(){
  grid = new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++) grid[idx(x,y)] = MAP[y][x]==='#'?1:0;
  roadCount=0; for(let k=0;k<grid.length;k++) if(grid[k]===0) roadCount++;
}
function bfs(sx,sy,blockBaches=true){
  const d = new Int16Array(W*H).fill(9999), q=[idx(sx,sy)]; d[q[0]]=0;
  for(let h=0;h<q.length;h++){
    const c=q[h], x=c%W, y=(c/W)|0;
    for(let k=0;k<4;k++){
      const nx=x+DX[k], ny=y+DY[k]; if(isWall(nx,ny))continue;
      const ni=idx(nx,ny); if(d[ni]!==9999)continue;
      if(blockBaches&&baches[ni])continue;
      d[ni]=d[c]+1; q.push(ni);
    }
  }
  return d;
}
function roadTiles(){ const r=[]; for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(!isWall(x,y)) r.push([x,y]); return r; }

/* ---------- niveles ---------- */
function setupLevel(n){
  level=n; genMap();
  runStats[n-1]={pts:0,t:0,fuel:0,deaths:0,smokes:0,stuns:0}; lvStartScore=score; lowT=0;
  baches = new Uint8Array(W*H); lomos = new Uint8Array(W*H); dogs = [];       // baches = obras en la calzada
  startTile = {x:16, y:27};
  const road = shuffle(roadTiles());
  const far = (x,y,m)=>Math.abs(x-startTile.x)+Math.abs(y-startTile.y)>m;
  // banderas y bidones
  flags=[]; tanks=[];
  const taken=new Set();
  const pick=(minStart,minSep,list)=>{
    for(const [x,y] of road){
      if(taken.has(idx(x,y))||!far(x,y,minStart))continue;
      if(list.some(f=>Math.abs(f.x-x)+Math.abs(f.y-y)<minSep))continue;
      taken.add(idx(x,y)); list.push({x,y}); return;
    }
  };
  for(let i=0;i<TOTAL_FLAGS;i++) pick(8,5,flags);
  for(let i=0;i<3;i++) pick(10,12,tanks);
  // obras en la calzada (bloquean el paso; sin aislar ninguna parte del mapa)
  const nB = Math.round(4+16*((n-1)/(MAXL-1)));
  let placed=0, nonBache=roadCount;
  for(const [x,y] of road){
    if(placed>=nB)break;
    if(taken.has(idx(x,y))||!far(x,y,4))continue;
    baches[idx(x,y)]=1;
    const d=bfs(startTile.x,startTile.y,true); let ok=0; for(let k=0;k<d.length;k++) if(d[k]!==9999) ok++;
    if(ok===nonBache-1){ placed++; nonBache--; taken.add(idx(x,y)); } else baches[idx(x,y)]=0;
  }
  // lomos de toro: solo en tramos rectos de calle (no bloquean, solo frenan)
  const nL = Math.round(4+10*((n-1)/(MAXL-1))); let pl=0;
  for(const [x,y] of road){
    if(pl>=nL)break; const i=idx(x,y);
    if(taken.has(i)||!far(x,y,4)) continue;
    const hz=!isWall(x-1,y)&&!isWall(x+1,y)&&isWall(x,y-1)&&isWall(x,y+1), vt=!isWall(x,y-1)&&!isWall(x,y+1)&&isWall(x-1,y)&&isWall(x+1,y);
    if(!hz&&!vt) continue;
    if(lomos[i-1]||lomos[i+1]||lomos[i-W]||lomos[i+W]) continue;
    lomos[i]=1; taken.add(i); pl++;
  }
  // enemigos
  const dS = bfs(startTile.x,startTile.y,true);
  const far2 = road.filter(([x,y])=>dS[idx(x,y)]>=30&&dS[idx(x,y)]<9999&&!baches[idx(x,y)]);
  const nE = 2+Math.floor((n-1)/5);
  enemySpawns=[];
  for(const [x,y] of far2){
    if(enemySpawns.length>=nE)break;
    if(enemySpawns.some(s=>Math.abs(s.x-x)+Math.abs(s.y-y)<12))continue;
    enemySpawns.push({x,y});
  }
  while(enemySpawns.length<nE){ const [x,y]=far2[rnd(far2.length)]; enemySpawns.push({x,y}); }
  // quiltros (perros callejeros) que andan por las calles
  const nD = Math.round(2+4*((n-1)/(MAXL-1)));
  for(const [x,y] of road){
    if(dogs.length>=nD)break; const i=idx(x,y);
    if(taken.has(i)||!far(x,y,8)) continue;
    if(dogs.some(d=>Math.abs(d.cx-x)+Math.abs(d.cy-y)<10)) continue;
    dogs.push({cx:x,cy:y,dir:-1,t:0,face:Math.random()<.5?0:2,pause:Math.random()*2,speed:1.1,scare:0,coat:dogs.length%3});
  }
  fuel=100; combo=1; clouds=[]; puffs=[]; floaters=[];
  resetActors();
}
function resetActors(){
  player = {cx:startTile.x, cy:startTile.y, dir:-1, t:0, face:3};
  const sp = 2.5+1.5*diff();
  enemies = enemySpawns.map((s,i)=>({cx:s.x,cy:s.y,dir:-1,t:0,face:0,stun:0,
    delay:0.8+i*1.1, speed:sp*(0.94+Math.random()*0.1), wander:i===0?0.1*(1-diff()):0.08+0.32*(1-diff())}));
  clouds=[]; puffs=[]; fuel=100; emptyT=0; slowT=0; brakeT=0; dogCD=0; invuln=2; fieldKey=-1; held.length=0; buf.d=-1;
}

const openP = (x,y)=>!isWall(x,y);
function movePlayer(dist){
  const w=wantDir();
  while(dist>1e-6){
    if(player.t===0){
      if(w>=0&&openP(player.cx+DX[w],player.cy+DY[w])) player.dir=w;
      else if(player.dir>=0&&!openP(player.cx+DX[player.dir],player.cy+DY[player.dir])) player.dir=-1;
      if(player.dir<0)break;

      player.cx+=DX[player.dir]; player.cy+=DY[player.dir]; player.t=1-player.t; player.dir=w; player.face=w;
    }
    const need=1-player.t;
    if(dist>=need){
      player.cx+=DX[player.dir]; player.cy+=DY[player.dir]; player.t=0; dist-=need;
      if(arrive()) return;
    } else { player.t+=dist; dist=0; }
  }
}
const pos=e=>({x:(e.cx+0.5+(e.dir>=0?DX[e.dir]*e.t:0))*T, y:(e.cy+0.5+(e.dir>=0?DY[e.dir]*e.t:0))*T});

function arrive(){
  const i=idx(player.cx,player.cy);
  if(baches[i]){ die('¡Chocaste con las obras!'); return true; }
  if(lomos[i]){ slowT=1.0; sfx.bump(); }
  for(let k=flags.length-1;k>=0;k--) if(flags[k].x===player.cx&&flags[k].y===player.cy){
    flags.splice(k,1); const pts=100*combo; score+=pts;
    floaters.push({x:(player.cx+.5)*T,y:(player.cy+.5)*T,t:1,txt:'+'+pts});
    combo=Math.min(combo+1,10); sfx.flag();
    if(!flags.length){ levelClear(); return true; }
  }
  for(let k=tanks.length-1;k>=0;k--) if(tanks[k].x===player.cx&&tanks[k].y===player.cy){
    tanks.splice(k,1); fuel=Math.min(100,fuel+30); score+=50; sfx.fuel();
    floaters.push({x:(player.cx+.5)*T,y:(player.cy+.5)*T,t:1,txt:'+BENCINA'});
  }
  return false;
}
function chooseDir(e){
  if(!field) return -1;
  const c=[];
  for(let k=0;k<4;k++){ const nx=e.cx+DX[k], ny=e.cy+DY[k];
    if(!isWall(nx,ny)&&!baches[idx(nx,ny)]) c.push(k); }
  if(!c.length) return -1;
  const rev=e.dir>=0?(e.dir+2)%4:-1;
  const nr=c.filter(k=>k!==rev), pool=nr.length?nr:c;
  if(Math.random()<e.wander) return pool[rnd(pool.length)];
  let best=pool[0], bv=1e9;
  for(const k of shuffle(pool.slice())){ const v=field[idx(e.cx+DX[k],e.cy+DY[k])]; if(v<bv){bv=v;best=k;} }
  return best;
}
function moveEnemy(e,dist){
  while(dist>1e-6){
    if(e.t===0){ e.dir=chooseDir(e); if(e.dir<0)return; e.face=e.dir; }
    const need=1-e.t;
    if(dist>=need){ e.t=0; e.cx+=DX[e.dir]; e.cy+=DY[e.dir]; dist-=need; if(lomos[idx(e.cx,e.cy)]) e.slow=1.0; }
    else { e.t+=dist; dist=0; }
  }
}
/* quiltros: caminan por las calles, a veces se detienen; no matan, pero te frenan, te quitan bencina y frenan a las patrullas */
function dogChoose(d){
  const c=[]; for(let k=0;k<4;k++){ const nx=d.cx+DX[k], ny=d.cy+DY[k]; if(!isWall(nx,ny)&&!baches[idx(nx,ny)]) c.push(k); }
  if(!c.length) return -1;
  const rev=d.dir>=0?(d.dir+2)%4:-1, nr=c.filter(k=>k!==rev), pool=nr.length?nr:c;
  if(d.dir>=0&&pool.includes(d.dir)&&Math.random()<0.8) return d.dir;
  return pool[rnd(pool.length)];
}
function moveDog(d,dist){
  while(dist>1e-6){
    if(d.t===0){ d.dir=dogChoose(d); if(d.dir<0)return; d.face=d.dir; }
    const need=1-d.t;
    if(dist>=need){ d.t=0; d.cx+=DX[d.dir]; d.cy+=DY[d.dir]; dist-=need; }
    else { d.t+=dist; dist=0; }
  }
}
function updateDogs(dt,pp){
  dogCD=Math.max(0,dogCD-dt);
  for(const d of dogs){
    if(d.pause>0) d.pause-=dt;
    else { if(d.t===0&&d.scare<=0&&Math.random()<dt*0.15) d.pause=1+Math.random()*2.5; else moveDog(d,(d.scare>0?2.6:d.speed)*dt); }
    if(d.scare>0) d.scare-=dt;
    const dp=pos(d);
    for(const e of enemies){                                   // los perros frenan a las patrullas
      if(e.delay>0||e.stun>0||e.dogCD>0) continue; const ep=pos(e);
      if(Math.hypot(ep.x-dp.x,ep.y-dp.y)<T*0.6){ e.stun=1.2; e.dogCD=3; sfx.dog(); }
    }
    if(!invuln&&dogCD<=0&&Math.hypot(pp.x-dp.x,pp.y-dp.y)<T*0.55){      // choque con la micro
      fuel=Math.max(0,fuel-18); score=Math.max(0,score-100); brakeT=0.8; dogCD=1.6; sfx.dog();
      floaters.push({x:dp.x,y:dp.y,t:1,txt:'¡GUAU!  -18'});
      if(d.dir>=0&&d.t>0){ d.cx+=DX[d.dir]; d.cy+=DY[d.dir]; d.t=1-d.t; d.dir=(d.dir+2)%4; d.face=d.dir; }
      d.scare=1.6; d.pause=0;
    }
  }
}

/* ---------- reglas ---------- */
function die(why){
  if(state!=='play')return;
  sfx.crash(); say(why,1.8); go('dying');
}
function finishRun(win){
  if(score>hi) setHi(score);
  go(win?'win':'over');
}
function levelClear(){
  const bonus=Math.round(fuel)*10; const st=runStats[level-1]; if(st) st.fuel=Math.round(fuel); score+=bonus; if(st) st.pts=score-lvStartScore;
  say((level>=MAXL?'¡ÚLTIMO RECORRIDO COMPLETADO!':'¡Recorrido completo!')+'  Bonus bencina +'+bonus,2.4); sfx.clear(); go('clear');
}
function updatePlay(dt){
  slowT=Math.max(0,slowT-dt); brakeT=Math.max(0,brakeT-dt);
  const spd = PLAYER_SPEED*(fuel>0?1:0.45)*(slowT>0?0.5:1)*(brakeT>0?0.3:1);
  if(player.dir>=0||wantDir()>=0){
    const before=fuel;
    movePlayer(spd*dt);
    if(player.dir>=0&&state==='play') fuel=Math.max(0,fuel-dt*(100/(50-18*diff())));
  }
  if(state!=='play')return;
  // campo de distancia hacia el jugador
  const k=idx(player.cx,player.cy);
  if(k!==fieldKey){ fieldKey=k; field=bfs(player.cx,player.cy,true); }
  // humo
  if(fuel<30){ lowT-=dt; if(lowT<=0){ sfx.low(); lowT=fuel<=0?0.4:fuel<12?0.55:1.1; } } else lowT=0;
  if(fuel<=0){ emptyT+=dt; if(emptyT>8){ emptyT=0; die('¡Te quedaste sin bencina!'); return; } } else emptyT=0;
  { const st=runStats[level-1]; if(st) st.t+=dt; }
  smokeCD-=dt; const wsm=wantSmoke||smokeReq; smokeReq=false;
  if(wsm&&smokeCD<=0&&fuel>=3){
    smokeCD=0.45; fuel-=3; sfx.smoke();
    const p=pos(player), f=player.face;
    runStats[level-1].smokes++;
    clouds.push({x:p.x-DX[f]*T*0.7,y:p.y-DY[f]*T*0.7,life:3.2,max:3.2});
    for(let i=0;i<10;i++) puffs.push({x:p.x-DX[f]*20,y:p.y-DY[f]*20,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,t:.9,s:10});
  }
  // partículas de escape
  puffT-=dt;
  if(puffT<=0&&player.dir>=0){ puffT=fuel<30?0.05:0.09; const p=pos(player),f=player.face;
    puffs.push({x:p.x-DX[f]*18,y:p.y-DY[f]*18,vx:-DX[f]*25+(Math.random()-.5)*20,vy:-DY[f]*25+(Math.random()-.5)*20,t:.7,s:fuel<30?10:5}); }
  for(const c of clouds) c.life-=dt;
  clouds=clouds.filter(c=>c.life>0);
  invuln=Math.max(0,invuln-dt);
  // enemigos
  const pp=pos(player);
  for(const e of enemies){
    if(e.delay>0){ e.delay-=dt; continue; }
    if(e.stun>0){ e.stun-=dt; }
    else {
      const ep=pos(e);
      for(const c of clouds) if(Math.hypot(ep.x-c.x,ep.y-c.y)<T*0.95){ e.stun=3-diff(); runStats[level-1].stuns++; sfx.stun(); score+=20; break; }
      if(e.stun<=0) moveEnemy(e,e.speed*(e.slow>0?0.5:1)*dt);
    }
    if(e.slow>0) e.slow-=dt; if(e.dogCD>0) e.dogCD-=dt;
    const ep=pos(e);
    if(!invuln&&e.stun<=0&&Math.hypot(ep.x-pp.x,ep.y-pp.y)<27*K){ die('¡Te pilló Carabineros!'); return; }
  }
  updateDogs(dt,pp);
}
function afterDeath(){
  lives--; combo=1; if(runStats[level-1]) runStats[level-1].deaths++;
  if(lives<=0){ finishRun(false); return; }
  resetActors(); go('ready'); say('¡Sigue el recorrido!',1.2);
}

/* ---------- bucle ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); fdt=dt; last=now; clock+=dt;
  if(paused){ draw(); requestAnimationFrame(frame); return; }
  stateT+=dt;
  if(msgT>0) msgT-=dt;
  if(state==='ready'){ if(stateT>1.4) go('play'); }
  else if(state==='play') updatePlay(dt);
  else if(state==='dying'){ if(stateT>1.8) afterDeath(); }
  else if(state==='clear'){ if(stateT>2.8){ if(level>=MAXL) finishRun(true); else if(level%3===0){ summaryLife=lives<MAXLIVES?1:0; lives+=summaryLife; if(summaryLife) setTimeout(()=>sfx.oneup(),500); go('summary'); } else nextLevel(); } }
  for(const p of puffs){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.s+=dt*14;}
  puffs=puffs.filter(p=>p.t>0);
  for(const f of floaters){f.t-=dt;f.y-=dt*30;}
  floaters=floaters.filter(f=>f.t>0);
  draw();
  requestAnimationFrame(frame);
}

/* ---------- dibujo ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill();}
const ROAD='#df9847', BLOCK='#55c200', EDGE='#c25500';
function drawWorld(cx0,cy0){
  const x0=Math.max(0,(cx0/T)|0), y0=Math.max(0,(cy0/T)|0);
  const x1=Math.min(W-1,x0+(VW/T|0)+2), y1=Math.min(H-1,y0+(VH/T|0)+2);
  const B=3;
  ctx.fillStyle=BLOCK; ctx.fillRect(0,0,VW,VH);                                  // fuera del mapa: manzana
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const px=Math.round(x*T-cx0), py=Math.round(y*T-cy0), w=isWall(x,y);
    ctx.fillStyle=w?BLOCK:ROAD; ctx.fillRect(px,py,T,T);
    if(!w){ const ii=idx(x,y); if(lomos[ii]) drawLomo(px+T/2,py+T/2,x,y); if(baches[ii]) drawObra(px+T/2,py+T/2);
      ctx.fillStyle=EDGE; if(x===0)ctx.fillRect(px,py,B,T); if(x===W-1)ctx.fillRect(px+T-B,py,B,T); if(y===0)ctx.fillRect(px,py,T,B); if(y===H-1)ctx.fillRect(px,py+T-B,T,B);
      continue; }
    ctx.fillStyle=EDGE;
    const iu=y>0&&!isWall(x,y-1), id=y<H-1&&!isWall(x,y+1), il=x>0&&!isWall(x-1,y), ir=x<W-1&&!isWall(x+1,y);
    if(iu)ctx.fillRect(px,py,T,B); if(id)ctx.fillRect(px,py+T-B,T,B);
    if(il)ctx.fillRect(px,py,B,T); if(ir)ctx.fillRect(px+T-B,py,B,T);
    // esquinas cóncavas (el borde debe cerrarse)
    const dg=(dx,dy)=>{const u=x+dx,v=y+dy;return u>=0&&v>=0&&u<W&&v<H&&!isWall(u,v);};
    if(!iu&&!il&&dg(-1,-1))ctx.fillRect(px,py,B,B);
    if(!iu&&!ir&&dg(1,-1))ctx.fillRect(px+T-B,py,B,B);
    if(!id&&!il&&dg(-1,1))ctx.fillRect(px,py+T-B,B,B);
    if(!id&&!ir&&dg(1,1))ctx.fillRect(px+T-B,py+T-B,B,B);
    // esquinas convexas redondeadas
    ctx.fillStyle=ROAD; const R=5;
    if(iu&&il)ctx.fillRect(px,py,R,R); if(iu&&ir)ctx.fillRect(px+T-R,py,R,R);
    if(id&&il)ctx.fillRect(px,py+T-R,R,R); if(id&&ir)ctx.fillRect(px+T-R,py+T-R,R,R);
  }
}
/* Obra en la calzada: pozo con tablón, valla a rayas con lámpara intermitente y conos */

}
